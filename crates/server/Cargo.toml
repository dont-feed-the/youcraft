[package]
name = "youcraft-server"
description = "The youcraft binary: YouCraft's pages, commands over HTTP, media, and its command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "youcraft"
path = "src/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
leptos = { workspace = true, features = ["ssr", "nonce"] }
leptos_axum.workspace = true
listenfd.workspace = true
rand.workspace = true
rsa.workspace = true
rlimit.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
youcraft-api.workspace = true
youcraft-i18n = { workspace = true, features = ["embed"] }
youcraft-recommend.workspace = true
youcraft-store.workspace = true
youcraft-transcode.workspace = true
youcraft-ui = { workspace = true, features = ["ssr"] }

[dev-dependencies]
rsa = { workspace = true, features = ["getrandom"] }
http-body-util = "0.1.3"

[lints]
workspace = true
