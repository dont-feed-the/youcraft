[package]
name = "youcraft-i18n"
description = "YouCraft's interface in every language: the catalogs of locales/, lookup, plurals, relative times"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.youcraft]
wasm = true

[features]
# Embed every catalog of locales/ in the binary, as the server needs; the browser instead installs
# the one catalog its page carries.
embed = []

[dependencies]
craft-i18n.workspace = true

[lints]
workspace = true

[dev-dependencies]
# An outside oracle for the compact numbers: ICU4X's own compact formatter, over its compiled
# CLDR data, in the ICU4X minor version craft-i18n is on.
icu_decimal = { version = "~2.3", default-features = false, features = ["compiled_data", "unstable"] }
icu_locale_core = { version = "~2.3", default-features = false }
