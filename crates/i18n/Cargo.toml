[package]
name = "youcraft-i18n"
description = "YouCraft's interface in every language: the catalogs of locales/, lookup, plurals, relative times"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.youcraft]
wasm = true
wasm-features = ["leptos"]

[features]
# Embed every catalog of locales/ in the binary, as the server needs; the browser instead installs
# the one catalog its page carries.
embed = []
# The language of the page as a Leptos context, for the components of `player` and `ui`.
leptos = ["dep:leptos"]

[dependencies]
craft-i18n.workspace = true
leptos = { workspace = true, optional = true }

[dev-dependencies]
# An outside oracle for the compact numbers: ICU4X's own compact formatter, over its compiled
# CLDR data.
icu_decimal.workspace = true
icu_locale_core.workspace = true
# The catalog checks read the code as Rust tokens, and string literals as the compiler does.
proc-macro2.workspace = true
syn.workspace = true
# The tests read every catalog, as the server embeds them, even when nothing else in the build
# turns `embed` on (`cargo test -p youcraft-i18n`).
youcraft-i18n = { path = ".", features = ["embed"] }

[lints]
workspace = true
