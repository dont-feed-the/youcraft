[package]
name = "youcraft-player"
description = "YouCraft's video player: HLS renditions streamed into <video> through Media Source Extensions, with YouTube's controls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.youcraft]
wasm = true
wasm-features = ["hydrate"]

[features]
# Runs in the browser: streams media and answers the controls. Without it the player only renders
# its markup, as the server does.
hydrate = ["leptos/hydrate", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:serde_json"]

[dependencies]
js-sys = { workspace = true, optional = true }
leptos.workspace = true
serde_json = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
  "AbortController",
  "AbortSignal",
  "AddEventListenerOptions",
  "console",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "Headers",
  "HtmlElement",
  "HtmlMediaElement",
  "HtmlVideoElement",
  "KeyboardEvent",
  "MediaError",
  "MediaSource",
  "MediaSourceReadyState",
  "Performance",
  "PointerEvent",
  "Request",
  "RequestInit",
  "Response",
  "SourceBuffer",
  "Storage",
  "TimeRanges",
  "Url",
  "Window",
] }
youcraft-api.workspace = true
youcraft-i18n = { workspace = true, features = ["leptos"] }

[lints]
workspace = true
